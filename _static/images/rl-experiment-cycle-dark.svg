<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title description">
<title id="title">rl experiment cycle</title>
<desc id="description">Configure, resolve and check, train, then evaluate. Review the evidence before revising the configuration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#72d9c1" stroke-width="1.6"/></marker></defs>
<rect width="600" height="300" rx="18" fill="#14111d"/>
<path transform="translate(75 105)" d="M-16 -23 H7 L18 -12 V23 H-16 Z M6 -23 V-11 H18 M-7 0 H9 M-7 9 H9" fill="none" stroke="#bca0e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="75" y="167" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="500" fill="#f3edf8">Configure</text>
<path transform="translate(225 105)" d="M-20 0 L-5 15 L23 -18" fill="none" stroke="#bca0e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="225" y="167" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="500" fill="#f3edf8">Check</text>
<path transform="translate(375 105)" d="M-22 19 L0 -20 L22 19 Z M0 -20 V19 M-22 19 L12 2 M22 19 L-12 2" fill="none" stroke="#bca0e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="375" y="167" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="500" fill="#f3edf8">Train</text>
<path transform="translate(525 105)" d="M-23 -22 V23 H24 M-15 12 L-3 -2 L8 4 L22 -17" fill="none" stroke="#bca0e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="525" y="167" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="500" fill="#f3edf8">Evaluate</text>
<path d="M115 105 h65" fill="none" stroke="#72d9c1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M265 105 h65" fill="none" stroke="#72d9c1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M415 105 h65" fill="none" stroke="#72d9c1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M525 193 V235 H75 V193" fill="none" stroke="#72d9c1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 7"/>
<text x="300" y="270" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" fill="#b9b1c5">Review &amp; refine</text>
</svg>
