<rect width="600" height="300" rx="18" fill="#faf8fd"/>
<path transform="translate(110 115)" d="M-21 -16 H21 M-21 0 H21 M-21 16 H21 M-9 -22 V-10 M10 -6 V6 M-4 10 V22" fill="none" stroke="#7850a5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="179" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="500" fill="#30263e">Resolve</text>
