<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
  <title id="title">CTRL-P environments by process and model</title>
  <desc id="desc">FFF has Lite V2 kinematic filling and native Dawn. PBF has Lite V2 thermal FEM, Julia Graph PBF and native Dawn. Mirage models resin curing. Lite FFF and PBF V0 retain historical contracts.</desc>
  <rect width="1040" height="510" rx="20" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" fill="#142138">
    <text x="32" y="47" font-size="25" font-weight="700">Choose the process, then the model</text>
    <text x="32" y="75" font-size="16" fill="#52627a">Different physics and control contracts; shared tooling does not imply transfer.</text>
    <g fill="#ffffff" stroke="#ced7e5" stroke-width="1.5">
      <rect x="170" y="106" width="400" height="88" rx="12"/>
      <rect x="590" y="106" width="418" height="88" rx="12"/>
      <rect x="170" y="212" width="270" height="98" rx="12"/>
      <rect x="460" y="212" width="270" height="98" rx="12"/>
      <rect x="750" y="212" width="258" height="98" rx="12"/>
      <rect x="170" y="328" width="838" height="78" rx="12"/>
      <rect x="170" y="424" width="838" height="58" rx="12"/>
    </g>
    <g font-size="18" font-weight="700">
      <text x="32" y="155" fill="#285f8f">FFF</text>
      <text x="32" y="265" fill="#285f8f">PBF</text>
      <text x="32" y="373" fill="#285f8f">RESIN</text>
      <text x="32" y="459" fill="#52627a">HISTORICAL</text>
      <text x="190" y="138">lite/fff-v2</text>
      <text x="610" y="138">Dawn FFF</text>
      <text x="190" y="245">lite/pbf-v2</text>
      <text x="480" y="245">graph/pbf-v0</text>
      <text x="770" y="245">Dawn PBF</text>
      <text x="190" y="358">mirage/sla-v0</text>
      <text x="190" y="459">lite/fff + lite/pbf V0</text>
    </g>
    <g font-size="16" fill="#52627a">
      <text x="190" y="169">Kinematic deposition / fill</text>
      <text x="610" y="169">Native process runtime</text>
      <text x="190" y="274">Thermal FEM surrogate</text>
      <text x="480" y="274">Julia spline-graph heat</text>
      <text x="770" y="274">Native process runtime</text>
      <text x="190" y="387">JAX curing + oxygen diffusion; continuous power on a fixed raster</text>
      <text x="470" y="459">Separate identities for replay and comparison</text>
    </g>
  </g>
</svg>
