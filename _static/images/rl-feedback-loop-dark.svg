<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title description">
<title id="title">rl feedback loop</title>
<desc id="description">The agent sends actions to the environment and receives observations and rewards.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#72d9c1" stroke-width="1.6"/></marker></defs>
<rect width="600" height="300" rx="18" fill="#14111d"/>
<path transform="translate(125 125)" d="M-22 19 L0 -20 L22 19 Z M0 -20 V19 M-22 19 L12 2 M22 19 L-12 2" fill="none" stroke="#bca0e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="125" y="189" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="500" fill="#f3edf8">Agent</text>
<path transform="translate(475 125)" d="M-22 -22 H22 V22 H-22 Z M-7 -22 V22 M7 -22 V22 M-22 -7 H22 M-22 7 H22" fill="none" stroke="#bca0e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="475" y="189" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="500" fill="#f3edf8">Environment</text>
<path d="M180 105 H420" fill="none" stroke="#72d9c1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="300" y="87" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" fill="#f3edf8">Action</text>
<path d="M420 150 H180" fill="none" stroke="#72d9c1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="300" y="245" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="500" fill="#f3edf8">Observation + reward</text>
</svg>
